name: Flutter CI

on:
  push:
    tags:
      - 'v*.*.*'
  # fork 首次启用 Actions 时可能吞掉第一次标签推送，保留按标签手动重试的入口。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Analyze, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        # 与 ci.yml 保持一致：打标签的发布提交同样必须通过格式门禁。
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 固定到真机验收过的引擎版本；两渠道都带 UNIFIED_DESIGN_PREVIEW，
      # 保证发布包与已评审外观一致（该参数只控制布局密度，与材质无关）。
      - name: Verify release design flows
        run: flutter test test/design_consistency_test.dart test/unified_design_preview_test.dart test/home_density_test.dart test/anchored_menu_test.dart test/material_stability_test.dart test/navigation_settings_test.dart --dart-define=UNIFIED_DESIGN_PREVIEW=true

      - name: Build release APK (github flavor)
        # GitHub 自分发包：github flavor，保留应用内一键自更新（REQUEST_INSTALL_PACKAGES）。
        # --target-platform 只限制 Flutter 引擎；--split-per-abi 才会排除插件里的
        # x86_64/32 位 OCR 原生库。固定内部版本号，避免分包默认 +2000 后
        # Play/GitHub 两渠道的更新顺序失衡。极老的 32 位机型不受支持。
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi -P force-version-code-ignoring-abi=true --flavor github --dart-define=UNIFIED_DESIGN_PREVIEW=true

      - name: Build release App Bundle (play flavor)
        # Google Play 上架用 AAB：play flavor 移除 REQUEST_INSTALL_PACKAGES（Play 政策禁止
        # 应用自更新），并 --dart-define=SELF_UPDATE=false 隐藏应用内自更新入口。
        # 与 APK 同用 verifinRelease 签名；AAB 含全部 ABI，由 Play 按设备分发。
        run: flutter build appbundle --release --flavor play --dart-define=SELF_UPDATE=false --dart-define=UNIFIED_DESIGN_PREVIEW=true

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          short_sha="${GITHUB_SHA::7}"
          version_name="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk "release-artifacts/verifin-${version_name}-arm64-${short_sha}.apk"
          cp build/app/outputs/bundle/playRelease/app-play-release.aab "release-artifacts/verifin-${version_name}-${short_sha}.aab"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verifin-android-release
          path: release-artifacts/*

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: android
    steps:
      # 必须排在下载制品之前：actions/checkout 默认 clean=true，会删除工作区里
      # 未跟踪的文件。放在下载之后会把刚下下来的 APK/AAB 一起清掉，发布出一个
      # 没有附件的空版本（v1.16.16 就是这样发的）。
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: verifin-android-release
          path: release-artifacts

      # 发布说明从 CHANGELOG.md 对应版本段落生成，避免像此前那样把某一版的
      # 说明硬编码进工作流、之后每次发版都重复旧文案。
      - name: Compose release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          section="$(awk -v v="$version" 'index($0, "## [" v "]") == 1 { c = 1; next } c && index($0, "## [") == 1 { exit } c { print }' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md 中找不到版本 $version 的条目"
            exit 1
          fi
          {
            echo "⚠️ 预发布（待验证）：此版本由 CI 自动构建，尚未经真机验收。"
            echo
            echo "📦 安装包为 **arm64-v8a** 架构，覆盖 2019 年后绝大多数安卓机型。极少数 32 位老设备可能无法安装。"
            echo
            printf '%s\n' "$section"
            echo
            echo "请下载 APK 直接覆盖安装，**不要卸载旧版本或清除应用数据**。换机或重装前请先在「数据管理」导出备份。"
            echo
            echo "应用内更新请开启「包含预发布版本（Beta）」以检测此版本；本次仍为预发布，不标记 Latest。"
          } > release-notes.md

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.aab
          # 附件匹配不到就整步失败，避免再发出一个没有安装包的「空」版本。
          fail_on_unmatched_files: true
          # 默认发预发布：不标记为 Latest，待真机测试通过后在 GitHub 手动改为正式版。
          prerelease: true
          make_latest: 'false'
          body_path: release-notes.md
